name: CFB Picks

# Runs both pipelines (college football and soccer) and publishes the site to the
# gh-pages branch, which GitHub Pages serves.
# Scheduled runs only fire from the repository's default branch.
on:
  schedule:
    # Every day at 13:17 UTC (8:17 AM ET in winter, 9:17 AM in summer), August to May.
    # Soccer is played most days of the week and its odds move until kickoff.
    - cron: "17 13 * 8-12,1-5 *"
  workflow_dispatch:
    inputs:
      week:
        description: "College football week to generate (empty = the current week)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "cfb-picks/**"
      - ".github/workflows/cfb-picks.yml"

permissions:
  contents: write # needed to push the built site to gh-pages

concurrency:
  group: cfb-picks-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfb-picks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cfb-picks/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Weeks already played never change: keep them between runs instead of asking ESPN again.
      - name: Cache API responses
        uses: actions/cache@v4
        with:
          path: cfb-picks/data/cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: espn-cache-

      - name: Tests
        run: python -m pytest -q

      # Out of season a sport keeps the picks already committed to the repository.
      - name: Generate college football picks
        env:
          WEEK: ${{ inputs.week }}
        run: |
          month=$(date -u +%-m)
          if [ -n "$WEEK" ]; then
            python -m src.picks --week "$WEEK"
          elif [ "$month" -ge 8 ] || [ "$month" -le 1 ]; then
            python -m src.picks
          else
            echo "College football is out of season: nothing to generate."
          fi

      - name: Generate soccer picks
        run: |
          month=$(date -u +%-m)
          if [ "$month" -ge 8 ] || [ "$month" -le 5 ]; then
            python -m src.soccer.picks
          else
            echo "The European leagues are out of season: nothing to generate."
          fi

      # The branch only ever holds the latest build, so each run replaces it.
      - name: Publish the site to gh-pages
        working-directory: cfb-picks/site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
