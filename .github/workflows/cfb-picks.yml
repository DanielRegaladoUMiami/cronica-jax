name: CFB Picks

# Runs the college football, NFL and European soccer pipelines and publishes the site to
# the gh-pages branch, which GitHub Pages serves.
# Scheduled runs only fire from the repository's default branch.
on:
  schedule:
    # Thursday, Saturday and Sunday, August to February: before Thursday night's game,
    # Saturday's college slate and the NFL's Sunday slate. Twice each day, at 06:17 and
    # 13:17 UTC (1:17 and 8:17 AM ET in winter), because GitHub starts scheduled runs late:
    # the first one here began almost seven hours after its time. The early run is the
    # insurance; the later one, when it is on time, has fresher lines.
    - cron: "17 6,13 * 8-12,1,2 0,4,6"
    # Tuesday and Wednesday of the European season: the Champions League plays then (the
    # Europa and Conference Leagues play on Thursday, which the line above covers until
    # February and this one from March).
    - cron: "17 13 * 9-12,1-5 2,3"
    - cron: "17 13 * 3-5 4"
  workflow_dispatch:
    inputs:
      week:
        description: "College football week to generate (empty = the current week)"
        required: false
        type: string
      nfl_week:
        description: "NFL week to generate (empty = the current week; 19-22 are the playoff rounds)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "cfb-picks/**"
      - ".github/workflows/cfb-picks.yml"

permissions:
  contents: write # needed to push the built site to gh-pages

concurrency:
  group: cfb-picks-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfb-picks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cfb-picks/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Weeks already played never change: keep them between runs instead of asking ESPN again.
      - name: Cache API responses
        uses: actions/cache@v4
        with:
          path: cfb-picks/data/cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: espn-cache-

      - name: Tests
        run: python -m pytest -q

      # Out of season a league keeps the picks already committed to the repository.
      - name: Generate college football picks
        env:
          WEEK: ${{ inputs.week }}
        run: |
          month=$(date -u +%-m)
          if [ -n "$WEEK" ]; then
            python -m src.picks --week "$WEEK"
          elif [ "$month" -ge 8 ] || [ "$month" -le 1 ]; then
            python -m src.picks
          else
            echo "College football is out of season: nothing to generate."
          fi

      - name: Generate NFL picks
        env:
          WEEK: ${{ inputs.nfl_week }}
        run: |
          month=$(date -u +%-m)
          if [ -n "$WEEK" ]; then
            python -m src.picks --league nfl --week "$WEEK"
          elif [ "$month" -ge 9 ] || [ "$month" -le 2 ]; then
            python -m src.picks --league nfl
          else
            echo "The NFL is out of season: nothing to generate."
          fi

      # Player projections need the schedule the step above just refreshed. If ESPN or Kalshi
      # do not answer, the site keeps the last ones (the page shows when they were made).
      # The record of flagged contracts lives on the published site: fetch it first, so
      # this run adds to it instead of starting over.
      - name: Generate NFL player projections
        env:
          WEEK: ${{ inputs.nfl_week }}
        run: |
          month=$(date -u +%-m)
          if [ -z "$WEEK" ] && [ "$month" -gt 2 ] && [ "$month" -lt 9 ]; then
            echo "The NFL is out of season: nothing to generate."
            exit 0
          fi
          site="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsS --max-time 30 "$site/data/nfl_props_log.json" -o /tmp/props_log.json \
            && python -c "import json; json.load(open('/tmp/props_log.json'))" \
            && cp /tmp/props_log.json site/data/nfl_props_log.json \
            || echo "No published record to continue from: using the one in the repository."
          python -m src.players.week ${WEEK:+--week "$WEEK"} \
            || echo "::warning::Player projections were not generated: the site keeps the last ones."

      # European cups: market odds next to Kalshi's prices. No model, so nothing to tune.
      - name: Generate the soccer board
        run: |
          python -m src.soccer.board \
            || echo "::warning::The soccer board was not generated: the site keeps the last one."

      # The branch only ever holds the latest build, so each run replaces it.
      - name: Publish the site to gh-pages
        working-directory: cfb-picks/site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
